<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社内掲示板</title>
    <!-- LINEの仕組みを読み込む -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        .user-name { font-size: 1.5rem; color: #00b900; font-weight: bold; }
    </style>
</head>
<body>
    <h1>社内掲示板</h1>
    <div id="loader">読み込み中...</div>
    <div id="content" style="display:none;">
        <p>こんにちは、<span id="name" class="user-name"></span>さん！</p>
        <p>あなたのLINEユーザーID:<br><small id="userId"></small></p>
    </div>

    <script>
        async function main() {
            // LIFFの初期化（あなたのLIFF IDを入れる）
            await liff.init({ liffId: "2010518553-09VESXxS" });

            if (!liff.isLoggedIn()) {
                liff.login(); // ログインしてなければログイン画面へ
            } else {
                // ログインしていたらプロフィールを取得
                const profile = await liff.getProfile();
                document.getElementById('name').innerText = profile.displayName;
                document.getElementById('userId').innerText = profile.userId;
                
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';
            }
        }
        main();
    </script>
</body>
</html>
